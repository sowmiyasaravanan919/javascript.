<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array </title>
</head>

<body>
    <script>
        //push
        let fruits = ["Apple", "banana", "Orange", "Pomogranet", "Grapes", "xxxxxx"];
        console.log(fruits);

        let nums = [34, 67, 89, 12, 67, 22, 7];
        console.log(nums);

        console.log(fruits.length);
        console.log(fruits.toString());
        document.write(fruits.toString());
        console.log(fruits.at(2));
        document.write(fruits.join(" | "));

        fruits.pop(); // to remove at end
        console.log(fruits);

        fruits.push("gova"); // to add at end
        console.log(fruits);

        fruits.shift(); // to remove at begining
        console.log(fruits);

        fruits.unshift("Avocada"); // to add at begining
        console.log(fruits);

        // to add/remove values in the middle
        fruits.splice(3, 2, "Dragon fruit", "Water apple", "Pineapple", "Water melon"); // to add set of values
        console.log(fruits);

        fruits.splice(3, 2); // to remove 2 values
        console.log(fruits);

        console.log(fruits.slice(3, 7));

        // not recommanded
        delete fruits[3];
        console.log(fruits);

        console.log(fruits.concat(nums));

        let nestedArray = [23, 45, 67, 89, [66, 77, 88], 90, 54, [11, 22],67];
        console.log(nestedArray);
        let flatArray = nestedArray.flat();
        console.log(flatArray);

        let evennums = flatArray.filter((n) => n % 2 == 0);
        console.log(evennums);

        let simpleArray = [1, 2, 3, 4, 5];
        console.log(simpleArray.reduce((acc, val) => acc + val, 0));

        console.log(simpleArray.every((n) => n >= 0));
        console.log(simpleArray.some((n) => n >= 1));


        console.log(Array.isArray(simpleArray));
        console.log(Array.from("simpleArray"));
        console.log(Array.from("123456789"));
        console.log(Array.of(11, 22, 33, 44, 55));

        // Array search method
        console.log(nestedArray.indexOf(67));
        console.log(nestedArray.lastIndexOf(67));
        console.log(nestedArray.find((n)=>n>=40));
        console.log(nestedArray.findIndex((n)=>n>=80));
        console.log(nestedArray.findLastIndex((n)=>n>=80));

        // sort methods
        console.log(nestedArray.sort());
        console.log(nestedArray.reverse());
        console.log(nestedArray.fill(0));


    </script>
</body>

</html>
