<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>math object</title>
</head>

<body>
    <script>
        console.log("Euler's  = ", Math.E);
        console.log("PI = ", Math.PI);
        console.log("SQRT2 = ", Math.SQRT2);
        console.log("SQRT 1/2 = ", Math.SQRT1_2);

        // random - 0 to 1
        let randomNumber = 1000 + Math.round(Math.random() * 100000);
        console.log("Random Num: ", randomNumber);

        let amount = 345.6789;
        console.log(Math.round(amount));
        console.log("ceil=", Math.ceil(amount));
        console.log("floor=", Math.floor(amount));
        console.log(Math.trunc(amount));
        console.log("sign = ", Math.sign(amount));
        console.log("power root = ", Math.pow(5, 3));
        console.log("Square root = ", Math.sqrt(81));
        console.log("Absolute = ", Math.abs(-81));

        console.log("Min : ",Math.min(56,34,78,23,90,12));
        console.log("Max : ",Math.max(56,34,78,23,90,12));
        console.log("imul : ",Math.imul(90,12));

    </script>
</body>

</html>
