<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String</title>
</head>
<body>
    <h4>String & Math Object</h4>
    <script>
        let mystr = "I like cat, but, my mom, doesnot like cat.";
        mystr[0] = "B";
        let name = "Sowmiya";
        console.log(mystr);

        console.log(mystr.length);
        console.log(mystr.charAt(3));
        console.log(mystr.charCodeAt(3));
        console.log(mystr.at(-1));
        console.log(mystr[4]);//this is indices
        console.log(mystr.slice(7,10));//this is string transform
        //this is string transform
        console.log(mystr.toUpperCase());
        console.log(mystr.toLowerCase());
        
        console.log(mystr.concat(name));
        console.log(mystr + name);
        console.log(name + mystr);         
        console.log(mystr.trim());//this is string transform
        console.log(mystr.trimStart());
        console.log(mystr.trimEnd());
        //this is string transform
        console.log(mystr.replace("cat","dog"));
        console.log(mystr.replaceAll("cat","dog"));
        
        console.log(name.repeat(5));
        console.log(mystr.split(","));

        let amount = "907";
        let num = "753";
        console.log(amount.padStart(10,"*"));
        console.log(num.padEnd(10,"*"));

        // string search
        console.log(mystr.indexOf("cat"));
        console.log(mystr.lastIndexOf("cat"));
        console.log(mystr.search("but"));
        console.log(mystr.includes("but"));
        console.log(mystr.match(/cat/));
        console.log(mystr.matchAll(/cat/g));
        console.log(mystr.startsWith("i"));
        console.log(mystr.endsWith("."));

 
    </script>    
</body>
</html>
